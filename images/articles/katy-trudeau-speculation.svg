<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Katy Perry and Justin Trudeau Spark Global Speculation</title>
  <desc id="desc">A paparazzi-style abstract media poster with camera flashes, red carpet lights and global speculation signals.</desc>
  <defs><radialGradient id="r" cx=".7" cy=".25"><stop stop-color="#5a0707"/><stop offset=".55" stop-color="#090909"/><stop offset="1" stop-color="#050505"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1400" height="1700" fill="url(#r)"/>
  <g stroke="#ff1a1a" stroke-width="3" fill="none" opacity=".38"><circle cx="1050" cy="360" r="210"/><circle cx="1050" cy="360" r="140"/><path d="M120 620h1160M120 1040h1160"/></g>
  <text x="90" y="220" fill="#ff1a1a" font-family="Orbitron, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="6">PAPARAZZI</text>
  <text x="90" y="355" fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="82" font-weight="900">KATY PERRY</text>
  <text x="90" y="448" fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="76" font-weight="900">&amp; JUSTIN</text>
  <text x="90" y="542" fill="#ff1a1a" font-family="Orbitron, Arial, sans-serif" font-size="86" font-weight="900">TRUDEAU</text>
  <text x="90" y="615" fill="#f5f5f5" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">SPARK GLOBAL SPECULATION</text>
  <g transform="translate(145 735)">
    <rect x="0" y="0" width="1110" height="630" rx="42" fill="#0b0b0b" stroke="#ff1a1a" stroke-opacity=".5"/>
    <g filter="url(#g)" fill="#ff1a1a"><circle cx="170" cy="140" r="34"/><circle cx="930" cy="110" r="26"/><circle cx="720" cy="410" r="30"/><circle cx="385" cy="485" r="22"/></g>
    <path d="M120 480c170-210 370-230 540-90s310 120 420-80" fill="none" stroke="#fff" stroke-width="7" opacity=".78"/>
    <path d="M110 515c220-136 396-152 610-48 150 73 255 46 362-35" fill="none" stroke="#ff1a1a" stroke-width="8"/>
    <g fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="24" font-weight="800"><text x="80" y="90">CAMERA FLASH</text><text x="700" y="570">MEDIA SIGNAL</text></g>
  </g>
  <text x="90" y="1505" fill="#ddd" font-family="Inter, Arial, sans-serif" font-size="28">Speculation is not confirmation. The real story is how attention travels.</text>
  <path d="M90 1565h480" stroke="#ff1a1a" stroke-width="4"/>
</svg>
