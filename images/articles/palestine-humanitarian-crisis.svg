<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Palestine Humanitarian Crisis</title>
  <desc id="desc">A respectful abstract humanitarian crisis poster with a red alert grid, aid route and silhouettes.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#111"/><stop offset="1" stop-color="#2b0505"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1400" height="1700" fill="url(#bg)"/>
  <g opacity=".12" stroke="#fff"><path d="M0 360h1400M0 720h1400M0 1080h1400M0 1440h1400M280 0v1700M560 0v1700M840 0v1700M1120 0v1700"/></g>
  <text x="90" y="215" fill="#ff1a1a" font-family="Orbitron, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="6">WORLD / HUMANITARIAN</text>
  <text x="90" y="350" fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="84" font-weight="900">PALESTINE</text>
  <text x="90" y="455" fill="#ff1a1a" font-family="Orbitron, Arial, sans-serif" font-size="78" font-weight="900">A HUMANITARIAN</text>
  <text x="90" y="545" fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="70" font-weight="900">CRISIS THE WORLD</text>
  <text x="90" y="635" fill="#fff" font-family="Orbitron, Arial, sans-serif" font-size="70" font-weight="900">CANNOT IGNORE</text>
  <g transform="translate(130 760)">
    <rect x="0" y="0" width="1140" height="550" rx="38" fill="#090909" stroke="#ff1a1a" stroke-opacity=".45"/>
    <path d="M90 390c190-180 340-120 500-250s300-90 460-20" fill="none" stroke="#ff1a1a" stroke-width="10" filter="url(#glow)"/>
    <g fill="#fff" opacity=".86"><circle cx="230" cy="355" r="42"/><rect x="195" y="405" width="70" height="115" rx="28"/><circle cx="520" cy="305" r="38"/><rect x="488" y="350" width="64" height="120" rx="26"/><circle cx="820" cy="250" r="44"/><rect x="783" y="302" width="74" height="130" rx="30"/></g>
    <g stroke="#fff" stroke-width="5" fill="none" opacity=".55"><path d="M115 130h220M115 170h150M780 440h250M850 475h180"/></g>
    <text x="90" y="95" fill="#ff1a1a" font-family="Orbitron, Arial, sans-serif" font-size="28" font-weight="900">AID ACCESS / CIVILIAN PROTECTION</text>
  </g>
  <text x="90" y="1460" fill="#f2f2f2" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700">Displacement, hunger, medical pressure and survival remain the center of the story.</text>
  <path d="M90 1520h520" stroke="#ff1a1a" stroke-width="4"/>
</svg>
