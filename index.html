<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png"
    href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presda — Coming Soon</title>
  <meta name="description" content="Presda — Your Daily Press. Coming soon." />
  <meta property="og:title" content="Presda — Coming Soon" />
  <meta property="og:description" content="Something powerful is coming soon." />
  <meta property="og:image" content="comingsoon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100vw;
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #000;
    }

    @media (max-width: 768px) {
      html, body { overflow-y: auto; }

      .page {
        min-height: 100vh;
        align-items: flex-start;
      }

      .hero {
        width: 100%;
        height: auto;
        min-height: auto;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="hero" src="./comingsoon.png" alt="Presda Coming Soon" />
  </main>
</body>
</html>
